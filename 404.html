<!DOCTYPE html>
<html lang="no">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="robots" content="noindex" />
        <title>Siden finnes ikke — Medlemssystem</title>
        <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
        <link href="css/site.css" rel="stylesheet" />
        <style>
            .error-page {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: var(--space-6);
                background: var(--color-bg);
                color: var(--color-text);
            }
            .error-page h1 {
                font-family: var(--font-mono);
                font-weight: 500;
                font-size: clamp(3rem, 8vw, 5rem);
                color: var(--accent);
            }
            .error-page p { color: var(--color-text-secondary); max-width: 480px; margin: var(--space-4) auto var(--space-6); }
        </style>
    </head>
    <body>
        <main class="error-page">
            <p class="mono-label">404</p>
            <h1>Siden finnes ikke</h1>
            <p>Medlemssystem har foreløpig kun én side — gå tilbake til forsiden for å se de tre tjenestene.</p>
            <a class="btn" href="/">Til forsiden</a>
        </main>
    </body>
</html>
